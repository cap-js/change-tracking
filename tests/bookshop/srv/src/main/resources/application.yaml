
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
  sql.init.separator: ";;"
cds:
  data-source.auto-config.enabled: false
  # Disable audit-log enforcement in tests: entities like DifferentFieldTypes
  # carry @PersonalData.IsPotentiallyPersonal fields but no accompanying
  # data-subject semantics (this is intentional for test coverage). CAP Java's
  # default audit-log handler rejects such operations with
  # "A data subject … is missing" which rolls back the transaction and prevents
  # the change-tracking trigger's changelog rows from being committed.
  audit-log:
    personal-data:
      throw-on-missing-data-subject: false
      enabled: false
  security:
    # Match mock users with default node mock users
    mock:
      users:
        - name: alice
          password: ""
          tenant: t1
          roles:
            - admin
            - support
        - name: bob
          password: ""
          tenant: t1
          roles:
            - builder
            - cds.ExtensionDeveloper
        - name: carol
          password: ""
          tenant: t1
          roles:
            - admin
            - cds.ExtensionDeveloper
        - name: dave
          password: ""
          tenant: t1
          roles:
            - admin
        - name: erin
          password: ""
          tenant: t2
          roles:
            - admin
            - cds.ExtensionDeveloper
        - name: fred
          password: ""
          tenant: t2
          features:
            - isbn
        - name: me
          password: ""
