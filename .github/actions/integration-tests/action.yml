name: "Integration tests"
description: "Run tests with BTP services being bound"
inputs:
  CF_API:
    description: "Cloud Foundry API endpoint"
    required: true
  CF_USER_ORIGIN:
    description: "Origin key of the platform IdP (SAP Cloud Identity Services) for Cloud Foundry"
    required: true
  CIS_ISSUER_URI:
    description: "Issuer URI of the SAP Cloud Identity Services tenant, used as audience of the GitHub OIDC token"
    required: true
  CF_ORG:
    description: "Cloud Foundry organization"
    required: true
  CF_SPACE:
    description: "Cloud Foundry space"
    required: true
  NODE_VERSION:
    description: "Node.js version to use for tests"
    required: true
  CDS_VERSION:
    description: "CDS version to use for tests"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install Cloud Foundry CLI (v8.18.3)
      shell: bash
      run: |
        wget "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8.18.3&source=github-rel" -O cf-cli.tar.gz
        tar -xvzf cf-cli.tar.gz
        sudo mv cf /usr/local/bin/
        sudo mv cf8 /usr/local/bin/
        cf --version

    - name: Authenticate with Cloud Foundry (GitHub OIDC)
      shell: bash
      env:
        CF_API: ${{ inputs.CF_API }}
        CF_ORG: ${{ inputs.CF_ORG }}
        CF_SPACE: ${{ inputs.CF_SPACE }}
        CF_USER_ORIGIN: ${{ inputs.CF_USER_ORIGIN }}
        CIS_ISSUER_URI: ${{ inputs.CIS_ISSUER_URI }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set. The calling job needs 'permissions: id-token: write'."
          exit 1
        fi
        # A trailing slash is a common mistake and would make the audience not match
        audience=$(jq -rn --arg a "${CIS_ISSUER_URI%/}" '$a|@uri')
        if ! githubJwt=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r '.value // empty'); then
          echo "::error::Could not get a GitHub OIDC token."
          exit 1
        fi
        if [ -z "$githubJwt" ]; then
          echo "::error::Could not get a GitHub OIDC token."
          exit 1
        fi
        echo "::add-mask::$githubJwt"
        for i in {1..5}; do
          cf api "$CF_API" && \
          cf auth --assertion "$githubJwt" --origin "$CF_USER_ORIGIN" && \
          cf target -o "$CF_ORG" -s "$CF_SPACE" && break
          echo "cf login failed, retrying ($i/5)..."
          sleep 10
          if [ "$i" -eq 5 ]; then
            echo "❌ cf login failed after 5 attempts."
            exit 1
          fi
        done

    - name: Use Node.js ${{ inputs.NODE_VERSION}}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.NODE_VERSION }}

    - name: Pin CDS 9 compatible stack
      if: ${{ inputs.CDS_VERSION == '9' }}
      shell: bash
      run: |
        npm pkg set "overrides.@cap-js/hana=^2"
        npm pkg set "overrides.@cap-js/sqlite=^2"
        npm pkg set "overrides.@cap-js/postgres=^2"
        npm pkg set "overrides.@sap/cds-mtxs=^3"
        npm pkg set "devDependencies.@sap/cds=^9"
        npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"
        npm pkg set --workspace=tests/bookshop-mtx "dependencies.@sap/cds=^9"
    - name: Install global CDS
      shell: bash
      run: npm i -g @sap/cds-dk@${{ inputs.CDS_VERSION }}
    - name: Install all dependencies
      shell: bash
      run: npm install

    - name: Set node env for HANA
      run: echo "NODE_VERSION_HANA=$(echo ${{ inputs.NODE_VERSION }} | tr . _)" >> $GITHUB_ENV
      shell: bash
    - name: Set CDS version env for HANA
      run: echo "CDS_VERSION_HANA=$(echo ${{ inputs.CDS_VERSION }} | tr . _)" >> $GITHUB_ENV
      shell: bash
    - name: CDS Versions being used
      run: cds v -i
      shell: bash

    # Deploy model to HANA
    - name: Create HDI Container
      shell: bash
      run: cf create-service hana hdi-shared cap-js-change-tracking-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-$CDS_VERSION_HANA-$NODE_VERSION_HANA
    - run: cd tests/bookshop/ && CDS_ENV=production cds deploy --to hana:cap-js-change-tracking-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-$CDS_VERSION_HANA-$NODE_VERSION_HANA
      shell: bash

    # Bind against BTP services
    - run: cds bind db -2 cap-js-change-tracking-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-$CDS_VERSION_HANA-$NODE_VERSION_HANA -o package.json
      shell: bash

    # Run tests in hybrid mode
    - run: cds bind --exec -- npx vitest --silent --exclude='tests/mtx/mtx.test.js'
      shell: bash

    # Cleanup BTP services
    - name: Delete HDI Container Key
      if: ${{ always() }}
      run: cf delete-service-key cap-js-change-tracking-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-$CDS_VERSION_HANA-$NODE_VERSION_HANA cap-js-change-tracking-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-$CDS_VERSION_HANA-$NODE_VERSION_HANA-key -f
      shell: bash

    # Note: The initial delete attempt often fails due to an "ongoing operation on service binding" error.
    - name: Delete HDI Container
      if: ${{ always() }}
      shell: bash
      run: |
        for i in {1..3}; do
          cf delete-service cap-js-change-tracking-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-$CDS_VERSION_HANA-$NODE_VERSION_HANA -f && break
          echo "HDI container delete failed, retrying ($i/3)..."
          sleep 10
          if [ "$i" -eq 3 ]; then
            echo "❌ HDI container delete failed after 3 attempts."
            exit 1
          fi
        done