name: CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    name: SQLite Tests with Node.js ${{ matrix.node-version }} and CDS ${{ matrix.cds-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        cds-version: [9, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg set "overrides.@cap-js/hana=^2"
          npm pkg set "overrides.@cap-js/sqlite=^2"
          npm pkg set "overrides.@cap-js/postgres=^2"
          npm pkg set "overrides.@sap/cds-mtxs=^3"
          npm pkg set "devDependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop-mtx "dependencies.@sap/cds=^9"
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: cds v -i
      - name: Run SQLite tests
        run: npm run test

  test-postgres:
    runs-on: ubuntu-latest
    name: PostgreSQL Tests with Node.js ${{ matrix.node-version }} and CDS ${{ matrix.cds-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        cds-version: [9, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Start PostgreSQL
        run: docker compose -f tests/bookshop/pg-stack.yml up -d --wait
      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg set "overrides.@cap-js/hana=^2"
          npm pkg set "overrides.@cap-js/sqlite=^2"
          npm pkg set "overrides.@cap-js/postgres=^2"
          npm pkg set "overrides.@sap/cds-mtxs=^3"
          npm pkg set "devDependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop-mtx "dependencies.@sap/cds=^9"
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: cds v -i
      - name: Deploy to PostgreSQL
        run: cd tests/bookshop && npm run deploy:pg
      - name: Run PostgreSQL tests
        run: CDS_ENV=pg npx vitest --silent

  test-hana:
    runs-on: ubuntu-latest
    name: HANA Integration Tests with Node.js ${{ matrix.node-version }} and CDS ${{ matrix.cds-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        cds-version: [9, latest]
        # On PRs/pushes only the Node.js 24 + CDS latest combination runs; the merge queue runs the full matrix.
        exclude: ${{ github.event_name == 'merge_group' && fromJSON('[]') || fromJSON('[{"node-version":"22.x","cds-version":9},{"node-version":"24.x","cds-version":9},{"node-version":"22.x","cds-version":"latest"}]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run HANA integration tests
        uses: ./.github/actions/integration-tests
        with:
          CF_API: ${{ secrets['CF_API'] }}
          CF_USERNAME: ${{ secrets['CF_USERNAME'] }}
          CF_PASSWORD: ${{ secrets['CF_PASSWORD'] }}
          CF_ORG: ${{ secrets['CF_ORG'] }}
          CF_SPACE: ${{ secrets['CF_SPACE'] }}
          NODE_VERSION: ${{ matrix.node-version }}
          CDS_VERSION: ${{ matrix.cds-version }}

  test-h2:
    runs-on: ubuntu-latest
    name: H2 Tests with Node.js ${{ matrix.node-version }} and CDS ${{ matrix.cds-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        cds-version: [9, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
      # tests/bookshop/pom.xml pins <jdk.version>25</jdk.version>; keep this in sync.
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg set "overrides.@cap-js/hana=^2"
          npm pkg set "overrides.@cap-js/sqlite=^2"
          npm pkg set "overrides.@cap-js/postgres=^2"
          npm pkg set "overrides.@sap/cds-mtxs=^3"
          npm pkg set "devDependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop-mtx "dependencies.@sap/cds=^9"
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: cds v -i
      - run: java -version
      - run: mvn -v
      - name: Run Java (H2) tests
        run: npm run test:h2

  results:
    if: always()
    runs-on: ubuntu-latest
    name: Summary
    needs: [test-sqlite, test-postgres, test-hana, test-h2]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
