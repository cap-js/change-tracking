name: OPA tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  test-opa:
    runs-on: ubuntu-latest
    name: OPA Tests on CAP ${{ matrix.cds-version }}
    strategy:
      fail-fast: false
      matrix:
        cds-version: [latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: true
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22.x
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - name: Run OPA tests
        run: cd tests/bookshop && npm run test:opa
      - name: Upload OPA test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opa-test-report-${{ matrix.cds-version }}
          path: tests/bookshop/report/
